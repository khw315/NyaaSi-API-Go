name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'dev*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Determine Build Environment
        id: build_env
        run: |
          if [[ "${{ github.ref_name }}" == dev* ]]; then
            VERSION="${GITHUB_REF_NAME#dev}"
            VERSION="${VERSION#=}"
            VERSION="${VERSION#-}"
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Building dev version: ${VERSION}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "env=production" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Building production version: ${VERSION}"
          else
            echo "env=production" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "Building default version: ${GITHUB_REF_NAME}"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyaasi-go-api
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.build_env.outputs.version }}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.build_env.outputs.env == 'production' }}
            type=raw,value=dev,enable=${{ steps.build_env.outputs.env == 'dev' }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.environment=${{ steps.build_env.outputs.env }}
            org.opencontainers.image.version=${{ steps.build_env.outputs.version }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENVIRONMENT=${{ steps.build_env.outputs.env }}
            VERSION=${{ steps.build_env.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: false
          provenance: false
          sbom: false

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
